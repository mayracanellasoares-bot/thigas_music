name: THIGAS Music - verificar e gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run tools/focus_checks.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug --flavor github -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: THIGAS-Music-debug
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          if-no-files-found: error
          retention-days: 14
